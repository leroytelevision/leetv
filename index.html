<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LEETV</title>
  <meta name="description" content="448 channels of broadcast static. Click the set to change channel.">
  <link rel="stylesheet" href="styles.css?v=15">

  <!-- Share preview. og:image must be an absolute URL; scrapers do not
       resolve relative paths. JPEG because the screen is static, which
       compresses appallingly as PNG. -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://leetv.tv/">
  <meta property="og:site_name" content="LEETV">
  <meta property="og:title" content="LEETV">
  <meta property="og:description" content="448 channels of broadcast static. Click the set to change channel.">
  <meta property="og:image" content="https://leetv.tv/og.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A pink retro television showing LEETV in hot pink static, on a dresser surrounded by blossom and floral wallpaper.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="LEETV">
  <meta name="twitter:description" content="448 channels of broadcast static. Click the set to change channel.">
  <meta name="twitter:image" content="https://leetv.tv/og.jpg">
  <meta name="theme-color" content="#e8697a">
</head>
<body>
  <h1 class="sr-only">LEETV</h1>

  <p class="sr-only" id="channel-name" aria-live="polite"></p>

  <div class="stage" tabindex="0" role="button" aria-label="Change channel"
       aria-describedby="channel-name">
    <!-- The static sits behind the photograph and is revealed only through
         the transparent screen cut-out. -->
    <div class="screen" aria-hidden="true">
      <canvas id="tube" width="160" height="120"></canvas>
      <div class="roll"></div>
      <div class="scanlines"></div>
      <div class="glass"></div>
    </div>

    <img class="set" src="thetvtouse.png" alt="A pink retro television set on a
         dresser, surrounded by floral wallpaper and pink blossom.">
  </div>

  <button class="sound" id="sound" type="button" aria-pressed="false"
          aria-label="Turn sound on">
    <span class="sound__glyph" aria-hidden="true">&#9834;</span>
  </button>

  <script src="script.js?v=16"></script>
</body>
</html>
